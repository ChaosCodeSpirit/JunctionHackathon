[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -ra
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    hardware: marks tests that require real quantum hardware (skipped in CI)
filterwarnings =
    ignore::DeprecationWarning:qiskit.*
    ignore::DeprecationWarning:stim.*
    ignore::DeprecationWarning:pymatching.*

[coverage:run]
source =
    surface_code
    extract_syndromes
    internal_helpers
    run_on_hardware
    diffqec
omit =
    tests/*
    iqm_utils/*
    benchmarks/*
    lumi/*
    main.py
    build_emerald_qubit_rotated.py

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    def __repr__
    \.\.\.
precision = 1
show_missing = true
skip_covered = false
